# PostgreSQL Polaris: local stack
#
#   docker compose -f docker/docker-compose.yml up -d            # database only
#   docker compose -f docker/docker-compose.yml --profile ui up -d  # + Adminer + pgAdmin
#
# All values come from docker/.env (see docker/.env.example).

name: polaris

services:
  db:
    build:
      context: .
      args:
        PG_MAJOR: ${PG_MAJOR:-17}
    image: polaris-db:${PG_MAJOR:-17}
    container_name: polaris-db
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polaris}
      POSTGRES_USER: ${POSTGRES_USER:-polaris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polaris_dev_only}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8 --data-checksums"
      POLARIS_SCALE: ${POLARIS_SCALE:-1}
      POLARIS_SEED: ${POLARIS_SEED:-42}
      POLARIS_SKIP_BOOTSTRAP: ${POLARIS_SKIP_BOOTSTRAP:-0}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    shm_size: 512mb
    volumes:
      # Mount the parent dir: PG <= 17 keeps PGDATA in ./data, the PG 18 image
      # in ./18/docker. One mount point works for both.
      - pgdata:/var/lib/postgresql
      - ../sql:/sql:ro
      - ../data:/data:ro
      - ../tests:/tests:ro
      - ../examples:/examples:ro
      - ../benchmarks:/benchmarks:ro
    healthcheck:
      # Probe over TCP: during first-boot initialisation the entrypoint runs a
      # temporary server on the Unix socket only, so a socket probe would report
      # healthy before the dataset build has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  adminer:
    image: adminer:4.8.1
    container_name: polaris-adminer
    profiles: ["ui"]
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: polaris-pgadmin
    profiles: ["ui"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@polaris.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-polaris_dev_only}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-8081}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: polaris-pgdata
  pgadmin:
    name: polaris-pgadmin
