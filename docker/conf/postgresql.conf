# ---------------------------------------------------------------------------
# PostgreSQL Polaris server configuration
#
# Loaded via `postgres -c config_file=/etc/postgresql/postgresql.conf`.
# Only overrides are listed; everything else uses the compiled-in defaults.
# Values are sized for a 4 GB laptop/CI container, not a production host.
# ---------------------------------------------------------------------------

# --- Connections -----------------------------------------------------------
listen_addresses = '*'
max_connections = 100

# --- Memory ----------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB

# --- Write-ahead log / checkpoints ----------------------------------------
wal_level = logical                 # required by module 13 (logical replication)
max_wal_senders = 10
max_replication_slots = 10
wal_compression = on
checkpoint_timeout = 10min
max_wal_size = 1GB
min_wal_size = 256MB

# --- Planner ---------------------------------------------------------------
random_page_cost = 1.1              # SSD-backed volumes
effective_io_concurrency = 200
default_statistics_target = 100
jit = off                           # deterministic EXPLAIN output in the curriculum

# --- Parallelism -----------------------------------------------------------
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 2

# --- Extensions loaded at startup -----------------------------------------
shared_preload_libraries = 'pg_stat_statements,pg_cron,pg_stat_kcache'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = off
cron.database_name = 'polaris'
cron.use_background_workers = on

# --- Autovacuum (module 11 reads these) ------------------------------------
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
log_autovacuum_min_duration = 1s

# --- Logging ---------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 250ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '
track_io_timing = on
track_functions = all

# --- Locale ----------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
